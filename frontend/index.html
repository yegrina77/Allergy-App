<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Allergy Manager</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15120F;--bg-glow:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(127,168,201,0.09), transparent 60%),
                 radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,154,82,0.06), transparent 55%);
    --panel:rgba(243,238,228,0.035);--ink:#F3EEE4;--ink-soft:#A79E8F;--border:rgba(243,238,228,0.12);
    --accent:#7FA8C9;--accent-soft:rgba(127,168,201,0.14);--warn:#C99A52;--warn-soft:rgba(201,154,82,0.14);
    --safe:#6FA37D;--safe-soft:rgba(111,163,125,0.14);--danger:#C97064;--danger-soft:rgba(201,112,100,0.14);
    --neutral:#8A8378;--neutral-soft:rgba(138,131,120,0.14);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background-color:var(--bg);background-image:var(--bg-glow);
    color:var(--ink);font-family:'IBM Plex Sans',sans-serif;line-height:1.5;min-height:100vh;
  }
  .wrap{max-width:1150px;margin:0 auto;padding:28px 20px 80px;}
  h1,h2{font-family:'Newsreader',serif;font-weight:600;margin:0;}
  a{color:var(--accent);}
  input,select{
    width:100%;padding:9px 11px;border:1px solid var(--border);border-radius:6px;
    font-family:inherit;font-size:14px;background:rgba(243,238,228,0.04);color:var(--ink);
  }
  input::placeholder{color:#6B655B;}
  input:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  select option{background-color:#1C1915;color:#F3EEE4;}
  label{font-size:12.5px;color:var(--ink-soft);display:block;margin:10px 0 4px;}
  button{font-family:inherit;cursor:pointer;}
  button.primary{
    background:var(--accent);color:#141210;border:none;padding:10px 16px;border-radius:7px;
    font-size:14px;font-weight:600;transition:box-shadow .15s, opacity .15s;
  }
  button.primary:hover:not(:disabled){box-shadow:0 0 0 4px var(--accent-soft);}
  button.primary:disabled{opacity:.35;cursor:not-allowed;}
  button.ghost{background:none;border:1px solid var(--border);padding:8px 13px;border-radius:7px;font-size:13px;color:var(--ink);}
  button.ghost:hover{border-color:var(--accent);color:var(--accent);}
  button.danger{background:none;border:1px solid var(--danger);color:var(--danger);padding:6px 11px;border-radius:6px;font-size:12.5px;}
  .panel{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:18px;
    backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,0.35);
  }
  .center-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;}
  .auth-card{max-width:380px;width:100%;background:var(--panel);border:1px solid var(--border);border-radius:14px;padding:32px;backdrop-filter:blur(14px);box-shadow:0 20px 60px rgba(0,0,0,0.45);}
  .auth-card .eyebrow{font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);letter-spacing:.04em;}
  .error-box{background:var(--danger-soft);color:var(--danger);padding:9px 12px;border-radius:6px;font-size:13px;margin-top:10px;display:none;}
  .tabs{display:flex;gap:6px;margin-bottom:20px;flex-wrap:wrap;}
  .tab{padding:8px 14px;border-radius:7px;border:1px solid var(--border);background:rgba(243,238,228,0.03);font-size:13.5px;color:var(--ink-soft);}
  .tab.active{background:var(--accent);border-color:var(--accent);color:#141210;}
  header.top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px;flex-wrap:wrap;gap:10px;}
  .who{font-size:13px;color:var(--ink-soft);text-align:right;}
  .who b{color:var(--ink);}
  .clock{font-family:'IBM Plex Mono',monospace;font-size:12.5px;color:var(--ink-soft);letter-spacing:.03em;margin-bottom:6px;}
  table{width:100%;border-collapse:collapse;font-size:13.5px;}
  th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-soft);padding:6px 8px;border-bottom:1px solid var(--border);}
  td{padding:9px 8px;border-bottom:1px solid rgba(243,238,228,0.06);vertical-align:top;}
  .tag{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:16px;font-size:12px;font-weight:500;background:var(--warn-soft);color:var(--warn);margin:2px 3px 2px 0;}
  .tag.low{background:var(--neutral-soft);color:var(--neutral);}
  .more-toggle{display:inline-block;}
  .more-toggle summary{list-style:none;font-size:11.5px;color:var(--ink-soft);cursor:pointer;}
  .more-toggle summary::-webkit-details-marker{display:none;}
  .dropzone{border:1.5px dashed var(--border);border-radius:8px;padding:22px 14px;text-align:center;cursor:pointer;color:var(--ink-soft);font-size:13.5px;}
  .dropzone.drag,.dropzone:hover{border-color:var(--accent);background:var(--accent-soft);}
  input[type=file]{display:none;}
  input[type=checkbox]{width:auto;padding:0;border:none;accent-color:var(--accent);cursor:pointer;}
  .preview{margin-top:10px;border-radius:8px;overflow:hidden;border:1px solid var(--border);display:none;}
  .preview img{display:block;width:100%;max-height:220px;object-fit:contain;background:#0F0D0A;}
  .spinner{width:13px;height:13px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-2px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .row-flex{display:flex;gap:16px;flex-wrap:wrap;}
  .col{flex:1;min-width:280px;}
  .chip{display:inline-block;padding:5px 11px;border-radius:6px;border:1px solid var(--border);background:rgba(243,238,228,0.03);font-size:12.5px;cursor:pointer;margin:3px 4px 3px 0;color:var(--ink-soft);}
  .chip.on{background:var(--accent);border-color:var(--accent);color:#141210;}
  .chip.filter{border-radius:20px;}
  .chip.filter.on{background:var(--ink);border-color:var(--ink);color:#141210;}
  .empty{color:var(--ink-soft);font-size:13.5px;padding:20px 0;text-align:center;}
  .staff-link-box{background:var(--accent-soft);border-radius:8px;padding:14px 16px;font-size:13px;margin-top:14px;}
  .staff-link-box code{font-family:'IBM Plex Mono',monospace;background:rgba(0,0,0,0.25);padding:2px 6px;border-radius:4px;color:var(--ink);}
  .ing-picker-box{border:1px solid var(--border);border-radius:8px;padding:12px;max-height:260px;overflow-y:auto;margin-top:8px;}
  .menu-item-card{background:rgba(243,238,228,0.025);border:1px solid var(--border);border-radius:10px;margin-bottom:8px;overflow:hidden;}
  .menu-item-card summary{list-style:none;cursor:pointer;padding:11px 14px;display:flex;align-items:center;gap:10px;}
  .menu-item-card summary::-webkit-details-marker{display:none;}
  .menu-item-card summary::before{content:'+';font-size:16px;color:var(--ink-soft);flex-shrink:0;width:14px;}
  .menu-item-card[open] summary::before{content:'–';}
  .menu-item-card .name{font-family:'Newsreader',serif;font-weight:600;font-size:15px;flex:1;}
  .dot-row{display:flex;gap:5px;flex-shrink:0;}
  .dot{width:8px;height:8px;border-radius:50%;display:inline-block;}
  .menu-item-card .item-detail{padding:0 14px 14px 38px;}
</style>
</head>
<body>

<div id="authScreen" class="center-screen" style="display:none;">
  <div class="auth-card">
    <div class="eyebrow">Allergy Manager</div>
    <h1 style="font-size:24px;margin:6px 0 18px;">Log in / Sign up</h1>
    <div class="tabs">
      <button class="tab active" id="tabLogin">Log in</button>
      <button class="tab" id="tabSignup">New company</button>
    </div>
    <div id="loginForm">
      <label>Company URL code (slug)</label>
      <input id="loginSlug" placeholder="e.g. greenleaf-cafe">
      <label>Email</label>
      <input id="loginEmail" type="email">
      <label>Password</label>
      <input id="loginPassword" type="password">
      <button class="primary" style="width:100%;margin-top:16px;" id="loginBtn">Log in</button>
    </div>
    <div id="signupForm" style="display:none;">
      <label>Company (restaurant) name</label>
      <input id="suCompany" placeholder="e.g. Green Leaf Cafe">
      <label>Your name</label>
      <input id="suName">
      <label>Email</label>
      <input id="suEmail" type="email">
      <label>Password (min 8 characters)</label>
      <input id="suPassword" type="password">
      <button class="primary" style="width:100%;margin-top:16px;" id="signupBtn">Create account (Owner)</button>
    </div>
    <div class="error-box" id="authError"></div>
  </div>
</div>

<div id="appScreen" class="wrap" style="display:none;">
  <header class="top">
    <div>
      <div class="eyebrow" style="font-family:'IBM Plex Mono',monospace;font-size:12px;color:var(--accent);" id="companyNameLabel"></div>
      <h1 style="font-size:24px;">Allergy Manager</h1>
    </div>
    <div class="who">
      <div class="clock" id="clockDisplay"></div>
      <b id="whoName"></b> · <span id="whoRole"></span>
      &nbsp;·&nbsp;<button class="ghost" id="logoutBtn" style="padding:5px 10px;font-size:12px;">Log out</button>
    </div>
  </header>

  <div class="tabs" id="mainTabs">
    <button class="tab active" data-view="ingredients">Ingredients</button>
    <button class="tab" data-view="subrecipes">Sub-Recipes</button>
    <button class="tab" data-view="menu">Menu</button>
    <button class="tab" data-view="invoices">Invoices</button>
    <button class="tab" data-view="reports">Reports</button>
    <button class="tab" data-view="staffLink">Staff View</button>
    <button class="tab" data-view="admins" id="tabAdmins" style="display:none;">Admin Accounts</button>
    <button class="tab" data-view="audit" id="tabAudit" style="display:none;">Change Log</button>
  </div>

  <div id="view-ingredients"></div>
  <div id="view-subrecipes" style="display:none;"></div>
  <div id="view-menu" style="display:none;"></div>
  <div id="view-invoices" style="display:none;"></div>
  <div id="view-reports" style="display:none;"></div>
  <div id="view-staffLink" style="display:none;"></div>
  <div id="view-admins" style="display:none;"></div>
  <div id="view-audit" style="display:none;"></div>
</div>

<script>
const ALLERGENS = ["Wheat","Rye","Barley","Oats","Spelt","Triticale","Crustacea","Molluscs","Fish","Egg","Milk",
  "Peanuts","Sesame","Soybeans","Lupin","Almond","Brazil Nut","Cashew","Hazelnut","Macadamia","Pecan","Pine Nut","Pistachio","Walnut","Sulphites","Royal Jelly"];

const UNIT_OPTIONS = ["g","kg","ml","l","each"];
const UNIT_FAMILY = {g:"weight", kg:"weight", ml:"volume", l:"volume", each:"count"};

const DIET_CATEGORY_LABELS = {
  "": "Not set / Unknown",
  "plant": "Plant-based",
  "animal_non_meat": "Animal product (dairy, egg, honey) — vegetarian OK",
  "meat_fish": "Meat or fish — not vegetarian",
};

let ME = null;
let reverifyTarget = null;
let selectedForDelete = new Set();
let ingredientsCache = [];
let subRecipesCache = [];
let menuCache = [];
let suppliersCache = [];

async function api(path, opts={}){
  const res = await fetch(path, {
    headers: {"Content-Type":"application/json"},
    credentials: "same-origin",
    ...opts,
  });
  const data = await res.json().catch(()=>({}));
  if(!res.ok) throw new Error(data.error || "Request failed");
  return data;
}

// ---------- Auth ----------
document.getElementById('tabLogin').onclick = () => switchAuthTab('login');
document.getElementById('tabSignup').onclick = () => switchAuthTab('signup');
function switchAuthTab(which){
  document.getElementById('tabLogin').classList.toggle('active', which==='login');
  document.getElementById('tabSignup').classList.toggle('active', which==='signup');
  document.getElementById('loginForm').style.display = which==='login' ? 'block':'none';
  document.getElementById('signupForm').style.display = which==='signup' ? 'block':'none';
  hideAuthError();
}
function showAuthError(msg){ const e=document.getElementById('authError'); e.textContent=msg; e.style.display='block'; }
function hideAuthError(){ document.getElementById('authError').style.display='none'; }

document.getElementById('loginBtn').onclick = async () => {
  hideAuthError();
  try{
    await api('/api/login', {method:'POST', body: JSON.stringify({
      companySlug: document.getElementById('loginSlug').value.trim(),
      email: document.getElementById('loginEmail').value.trim(),
      password: document.getElementById('loginPassword').value,
    })});
    boot();
  }catch(e){ showAuthError(e.message); }
};

document.getElementById('signupBtn').onclick = async () => {
  hideAuthError();
  try{
    await api('/api/signup', {method:'POST', body: JSON.stringify({
      companyName: document.getElementById('suCompany').value.trim(),
      name: document.getElementById('suName').value.trim(),
      email: document.getElementById('suEmail').value.trim(),
      password: document.getElementById('suPassword').value,
    })});
    boot();
  }catch(e){ showAuthError(e.message); }
};

document.getElementById('logoutBtn').onclick = async () => {
  await api('/api/logout', {method:'POST'});
  location.reload();
};

async function boot(){
  const data = await api('/api/me');
  if(!data.user){
    document.getElementById('authScreen').style.display='flex';
    document.getElementById('appScreen').style.display='none';
    return;
  }
  ME = data;
  document.getElementById('authScreen').style.display='none';
  document.getElementById('appScreen').style.display='block';
  document.getElementById('companyNameLabel').textContent = data.company.name;
  document.getElementById('whoName').textContent = data.user.name;
  document.getElementById('whoRole').textContent = data.user.role === 'owner' ? 'Owner' : 'Admin';
  if(data.user.role === 'owner'){
    document.getElementById('tabAdmins').style.display='inline-block';
    document.getElementById('tabAudit').style.display='inline-block';
  }
  await Promise.all([loadSuppliers(), loadIngredients(), loadSubRecipes(), loadMenu()]);
  renderIngredientsView();
  renderSubRecipesView();
  renderMenuView();
  renderStaffLinkView();
}

// ---------- Tabs ----------
document.querySelectorAll('#mainTabs .tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('#mainTabs .tab').forEach(t=>t.classList.remove('active'));
    tab.classList.add('active');
    ['ingredients','subrecipes','menu','invoices','reports','staffLink','admins','audit'].forEach(v => {
      document.getElementById('view-'+v).style.display = (v===tab.dataset.view) ? 'block' : 'none';
    });
    const v = tab.dataset.view;
    if(v === 'ingredients') renderIngredientsView();
    if(v === 'subrecipes') renderSubRecipesView();
    if(v === 'menu') renderMenuView();
    if(v === 'invoices') renderInvoicesView();
    if(v === 'reports') renderReportsView();
    if(v === 'staffLink') renderStaffLinkView();
    if(v === 'admins') loadAdmins();
    if(v === 'audit') loadAudit();
  });
});

// ---------- Shared renderers ----------
function allergenTagsHtml(allergens, maxShow){
  maxShow = maxShow || 5;
  if(!allergens || !allergens.length) return '<span style="color:var(--ink-soft);font-size:13px;">None</span>';
  const shown = allergens.slice(0, maxShow);
  const rest = allergens.slice(maxShow);
  let html = shown.map(a => `<span class="tag ${a.confidence==='low'?'low':''}">${escapeHtml(a.name)}</span>`).join('');
  if(rest.length){
    html += `<details class="more-toggle"><summary>+${rest.length} more</summary>${rest.map(a => `<span class="tag ${a.confidence==='low'?'low':''}">${escapeHtml(a.name)}</span>`).join('')}</details>`;
  }
  return html;
}

const DIET_FLAG_UI = [
  {key:'gluten', label:'Gluten Free'},
  {key:'dairy', label:'Dairy Free'},
  {key:'nut', label:'Nut Free'},
  {key:'shellfish', label:'Shellfish Free'},
];

function dietBadgesHtml(dietFlags){
  if(!dietFlags) return '';
  return DIET_FLAG_UI.map(def => {
    const ok = dietFlags[def.key+'Free'];
    const culprits = dietFlags[def.key+'Culprits'] || [];
    const maxNames = 3;
    let names = culprits.slice(0, maxNames).map(escapeHtml).join(', ');
    if(culprits.length > maxNames) names += `, +${culprits.length - maxNames} more`;
    if(ok === true) return `<span class="tag" style="background:var(--safe-soft);color:var(--safe);">${def.label}</span>`;
    if(ok === false){
      const why = names ? ` (has: ${names})` : '';
      return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Not ${def.label}${why}</span>`;
    }
    const why = names ? ` (unverified: ${names})` : '';
    return `<span class="tag" style="background:var(--neutral-soft);color:var(--neutral);">${def.label}: unverified${why}</span>`;
  }).join('');
}

function vegBadgesHtml(vegFlags){
  if(!vegFlags) return '';
  const one = (val, label, culprits) => {
    if(val === true) return `<span class="tag" style="background:var(--safe-soft);color:var(--safe);">${label}</span>`;
    if(val === false){
      const maxNames = 3;
      let names = (culprits||[]).slice(0, maxNames).map(escapeHtml).join(', ');
      if((culprits||[]).length > maxNames) names += `, +${culprits.length - maxNames} more`;
      const why = names ? ` (has: ${names})` : '';
      return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Not ${label}${why}</span>`;
    }
    return `<span class="tag" style="background:var(--neutral-soft);color:var(--neutral);">${label}: not classified</span>`;
  };
  return one(vegFlags.vegetarian, 'Vegetarian', vegFlags.vegetarianCulprits) + one(vegFlags.vegan, 'Vegan', vegFlags.veganCulprits);
}

function priceCellHtml(ing){
  if(ing.is_free) return '<span style="color:var(--safe);font-family:inherit;">Free</span>';
  if(ing.price == null) return '<span style="color:var(--ink-soft);font-family:inherit;">—</span>';
  const pkg = (ing.unit && ing.package_qty) ? ` / ${ing.package_qty}${ing.unit}` : '<span style="color:var(--warn);font-family:inherit;"> (no unit set)</span>';
  return `$${Number(ing.price).toFixed(2)}${pkg}`;
}

const RECHECK_DUE_DAYS = 180; // ~6 months

function dotRowHtml(dietFlags, vegFlags){
  const defs = [
    {val: dietFlags && dietFlags.glutenFree, label:'Gluten Free'},
    {val: dietFlags && dietFlags.dairyFree, label:'Dairy Free'},
    {val: dietFlags && dietFlags.nutFree, label:'Nut Free'},
    {val: dietFlags && dietFlags.shellfishFree, label:'Shellfish Free'},
    {val: vegFlags && vegFlags.vegetarian, label:'Vegetarian'},
    {val: vegFlags && vegFlags.vegan, label:'Vegan'},
  ];
  return `<span class="dot-row">${defs.map(d => {
    const color = d.val === true ? 'var(--safe)' : (d.val === false ? 'var(--danger)' : '#57514A');
    return `<span class="dot" style="background:${color};" title="${d.label}${d.val===true?': yes':(d.val===false?': no':': not classified')}"></span>`;
  }).join('')}</span>`;
}

function verifiedBadgeHtml(lastVerifiedAt, isFree){
  if(isFree) return `<span class="tag" style="background:var(--safe-soft);color:var(--safe);">No label needed</span>`;
  if(!lastVerifiedAt) return `<span class="tag" style="background:var(--warn-soft);color:var(--warn);">Photo needed</span>`;
  const days = Math.floor((Date.now() - new Date(lastVerifiedAt).getTime()) / (1000*60*60*24));
  const dateStr = formatDate(lastVerifiedAt);
  if(days > RECHECK_DUE_DAYS){
    return `<span class="tag" style="background:var(--warn-soft);color:var(--warn);">Re-check due · ${dateStr}</span>`;
  }
  return `<span style="color:var(--ink-soft);">${dateStr}</span>`;
}

// ---------- Reusable ingredient picker (search + supplier filter + chips) ----------
function setupIngredientPicker({searchId, filterRowId, boxId, selectedMap}){
  let currentFilter = 'all';
  let currentSearch = '';

  function matches(ing){
    if(currentFilter === 'all') return true;
    if(currentFilter === 'none') return !ing.supplier_id;
    return ing.supplier_id === currentFilter;
  }

  function renderFilterRow(){
    const row = document.getElementById(filterRowId);
    const filters = [
      {id:'all', label:'All'},
      {id:'none', label:'No Supplier'},
      ...suppliersCache.map(s => ({id:s.id, label:s.name})),
    ];
    row.innerHTML = filters.map(f => `<button type="button" class="chip filter ${currentFilter===f.id?'on':''}" data-filter="${f.id}">${escapeHtml(f.label)}</button>`).join('');
    row.querySelectorAll('[data-filter]').forEach(btn => {
      btn.onclick = () => { currentFilter = btn.dataset.filter; renderFilterRow(); renderChips(); };
    });
  }

  function renderChips(){
    const box = document.getElementById(boxId);
    const q = currentSearch.trim().toLowerCase();
    const filtered = ingredientsCache.filter(ing => matches(ing) && (!q || ing.name.toLowerCase().includes(q)));
    if(!ingredientsCache.length){ box.innerHTML = '<span class="empty">Register ingredients first.</span>'; return; }
    if(!filtered.length){ box.innerHTML = '<span class="empty">No matching ingredients.</span>'; return; }
    box.innerHTML = filtered.map(ing => {
      const sel = selectedMap.has(ing.id);
      const cur = selectedMap.get(ing.id) || {qty:'', unit: ing.unit || 'g'};
      return `<div style="margin:2px 0;">
        <span class="chip ${sel?'on':''}" data-ing="${ing.id}">${escapeHtml(ing.name)}${ing.supplier_name ? ' <span style="opacity:.7;">('+escapeHtml(ing.supplier_name)+')</span>' : ''}${ing.is_free ? ' <span style="opacity:.7;">(free)</span>':''}</span>
        ${sel ? `<input type="number" step="any" class="usage-qty" data-ing="${ing.id}" placeholder="qty" value="${cur.qty}" style="width:64px;display:inline-block;padding:4px 6px;margin-left:4px;font-size:12px;">
        <select class="usage-unit" data-ing="${ing.id}" style="width:62px;display:inline-block;padding:4px 4px;margin-left:2px;font-size:12px;">
          ${UNIT_OPTIONS.map(u => `<option value="${u}" ${cur.unit===u?'selected':''}>${u}</option>`).join('')}
        </select>` : ''}
      </div>`;
    }).join('');

    box.querySelectorAll('[data-ing].chip').forEach(chip => {
      chip.onclick = () => {
        const id = chip.dataset.ing;
        if(selectedMap.has(id)) selectedMap.delete(id);
        else {
          const ing = ingredientsCache.find(i => i.id === id);
          selectedMap.set(id, {qty:'', unit: (ing && ing.unit) || 'g'});
        }
        renderChips();
      };
    });
    box.querySelectorAll('.usage-qty').forEach(inp => {
      inp.oninput = () => {
        const cur = selectedMap.get(inp.dataset.ing) || {};
        cur.qty = inp.value;
        selectedMap.set(inp.dataset.ing, cur);
      };
    });
    box.querySelectorAll('.usage-unit').forEach(sel => {
      sel.onchange = () => {
        const cur = selectedMap.get(sel.dataset.ing) || {};
        cur.unit = sel.value;
        selectedMap.set(sel.dataset.ing, cur);
      };
    });
  }

  renderFilterRow();
  renderChips();
  document.getElementById(searchId).addEventListener('input', e => { currentSearch = e.target.value; renderChips(); });
}

function renderIngredientTable(nameQuery, supplierQuery){
  const listEl = document.getElementById('ingredientList');
  if(!listEl) return;
  const nq = (nameQuery||'').trim().toLowerCase();
  const sq = (supplierQuery||'').trim().toLowerCase();
  const filtered = ingredientsCache.filter(ing =>
    (!nq || ing.name.toLowerCase().includes(nq)) &&
    (!sq || (ing.supplier_name||'').toLowerCase().includes(sq))
  );
  if(!ingredientsCache.length){ listEl.innerHTML = '<div class="empty">No ingredients registered yet.</div>'; return; }
  if(!filtered.length){ listEl.innerHTML = '<div class="empty">No matching ingredients.</div>'; return; }

  const filteredIds = new Set(filtered.map(i => i.id));
  const allVisibleSelected = filtered.length > 0 && filtered.every(i => selectedForDelete.has(i.id));

  listEl.innerHTML = `
    <div id="bulkDeleteToolbar" style="display:${selectedForDelete.size ? 'flex':'none'};align-items:center;gap:10px;margin-bottom:8px;">
      <span style="font-size:12.5px;color:var(--ink-soft);"><b id="bulkSelCount">${selectedForDelete.size}</b> selected</span>
      <button class="danger" id="bulkDeleteBtn">Delete Selected</button>
      <button class="ghost" id="bulkClearBtn" style="padding:5px 9px;font-size:11px;">Clear</button>
    </div>
    <table><thead><tr>
      <th><input type="checkbox" id="selectAllVisible" ${allVisibleSelected?'checked':''}></th>
      <th>Name</th><th>Supplier / Code</th><th>Price</th><th>Allergens</th><th>Diet</th><th>Verified</th><th></th>
    </tr></thead><tbody>
    ${filtered.map(ing => `
      <tr>
        <td><input type="checkbox" class="ing-check" data-id="${ing.id}" ${selectedForDelete.has(ing.id)?'checked':''}></td>
        <td><b>${escapeHtml(ing.name)}</b>${ing.has_photo ? ` <button class="ghost" data-view-photo="${ing.id}" style="padding:2px 8px;font-size:11px;">Photo</button>` : ''}</td>
        <td style="font-size:12.5px;color:var(--ink-soft);">${ing.supplier_name ? escapeHtml(ing.supplier_name) : '—'}${ing.product_code ? '<br><span style="font-family:\'IBM Plex Mono\',monospace;">'+escapeHtml(ing.product_code)+'</span>' : ''}</td>
        <td style="font-size:12.5px;font-family:'IBM Plex Mono',monospace;">${priceCellHtml(ing)}</td>
        <td>${allergenTagsHtml(ing.allergens)}</td>
        <td style="font-size:12px;color:var(--ink-soft);">${escapeHtml((DIET_CATEGORY_LABELS[ing.diet_category||''] || 'Not set / Unknown').split(' — ')[0])}</td>
        <td style="font-size:12px;">${verifiedBadgeHtml(ing.last_verified_at, ing.is_free)}</td>
        <td><button class="ghost" data-reverify="${ing.id}" style="padding:5px 9px;font-size:11px;">Re-verify</button> <button class="danger" data-del-ing="${ing.id}">Delete</button></td>
      </tr>`).join('')}
  </tbody></table>`;

  function updateToolbar(){
    document.getElementById('bulkDeleteToolbar').style.display = selectedForDelete.size ? 'flex' : 'none';
    const countEl = document.getElementById('bulkSelCount');
    if(countEl) countEl.textContent = selectedForDelete.size;
    const selectAll = document.getElementById('selectAllVisible');
    if(selectAll) selectAll.checked = filtered.length > 0 && filtered.every(i => selectedForDelete.has(i.id));
  }

  document.getElementById('selectAllVisible').onchange = (e) => {
    if(e.target.checked) filtered.forEach(i => selectedForDelete.add(i.id));
    else filtered.forEach(i => selectedForDelete.delete(i.id));
    listEl.querySelectorAll('.ing-check').forEach(cb => { cb.checked = selectedForDelete.has(cb.dataset.id); });
    updateToolbar();
  };
  listEl.querySelectorAll('.ing-check').forEach(cb => {
    cb.onchange = () => {
      if(cb.checked) selectedForDelete.add(cb.dataset.id);
      else selectedForDelete.delete(cb.dataset.id);
      updateToolbar();
    };
  });
  const bulkDeleteBtn = document.getElementById('bulkDeleteBtn');
  if(bulkDeleteBtn){
    bulkDeleteBtn.onclick = async () => {
      if(!confirm(`Delete ${selectedForDelete.size} selected ingredients?`)) return;
      bulkDeleteBtn.disabled = true;
      const originalText = bulkDeleteBtn.textContent;
      bulkDeleteBtn.innerHTML = '<span class="spinner"></span> Deleting...';
      try{
        await api('/api/ingredients/bulk-delete', {method:'POST', body: JSON.stringify({ids:[...selectedForDelete]})});
        selectedForDelete.clear();
        await loadIngredients();
        renderIngredientTable(nameQuery, supplierQuery);
      }catch(e){
        alert(e.message);
        bulkDeleteBtn.disabled = false;
        bulkDeleteBtn.textContent = originalText;
      }
    };
  }
  const bulkClearBtn = document.getElementById('bulkClearBtn');
  if(bulkClearBtn){
    bulkClearBtn.onclick = () => {
      selectedForDelete.clear();
      renderIngredientTable(nameQuery, supplierQuery);
    };
  }

  listEl.querySelectorAll('[data-reverify]').forEach(btn=>{
    btn.onclick = () => {
      reverifyTarget = ingredientsCache.find(i => i.id === btn.dataset.reverify) || null;
      renderIngredientsView();
      window.scrollTo({top:0, behavior:'smooth'});
    };
  });
  listEl.querySelectorAll('[data-del-ing]').forEach(btn=>{
    btn.onclick = async () => {
      if(!confirm('Delete this ingredient?')) return;
      await api('/api/ingredients/'+btn.dataset.delIng, {method:'DELETE'});
      selectedForDelete.delete(btn.dataset.delIng);
      await loadIngredients(); renderIngredientsView();
    };
  });
  listEl.querySelectorAll('[data-view-photo]').forEach(btn=>{
    btn.onclick = async () => {
      const res = await api('/api/ingredients/' + btn.dataset.viewPhoto + '/photo');
      if(res.photoBase64){
        const win = window.open('');
        win.document.write(`<img src="data:image/jpeg;base64,${res.photoBase64}" style="max-width:100%;">`);
      }
    };
  });
}

function renderIngredientsView(){
  const el = document.getElementById('view-ingredients');
  el.innerHTML = `
    <div class="row-flex">
      <div class="col panel">
        <h2 style="font-size:17px;margin-bottom:12px;">Register Ingredient Photo</h2>
        ${reverifyTarget ? `<div style="background:var(--accent-soft);border-radius:7px;padding:9px 12px;font-size:13px;margin-bottom:12px;">Re-verifying: <b>${escapeHtml(reverifyTarget.name)}</b> <button class="ghost" id="cancelReverifyBtn" style="padding:2px 8px;font-size:11px;margin-left:6px;">Cancel</button></div>` : ''}

        <div class="preview" id="preview"><img id="previewImg"></div>
        <button class="primary" style="width:100%;margin-top:10px;" id="analyzeBtn" disabled>Analyze with AI</button>
        <div id="analyzeStatus" style="font-size:13px;color:var(--ink-soft);margin-top:8px;"></div>
        <div id="analyzeResult"></div>
        ${!reverifyTarget ? `
        <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
          <button class="ghost" id="noPhotoToggleBtn" style="font-size:12.5px;">No label to photograph? (free items like tap water, or add a photo later)</button>
          <div id="noPhotoForm" style="display:none;margin-top:10px;">
            <label>Ingredient name</label>
            <input id="noPhotoName" placeholder="e.g. Water, or Curry Roux Hot">
            <label style="display:flex;align-items:center;gap:7px;margin-top:10px;cursor:pointer;">
              <input type="checkbox" id="noPhotoIsFree" style="width:auto;"> This ingredient is free (e.g. tap water) — no cost, no allergens
            </label>
            <div id="noPhotoDietRow" style="margin-top:8px;">
              <label>Diet category (for Vegetarian/Vegan)</label>
              <select id="noPhotoDietCategory">
                ${Object.entries(DIET_CATEGORY_LABELS).map(([v,l]) => `<option value="${v}">${l}</option>`).join('')}
              </select>
            </div>
            <button class="primary" style="width:100%;margin-top:10px;" id="noPhotoSaveBtn">Save</button>
          </div>
        </div>` : ''}
      </div>
      <div class="col panel">
        <h2 style="font-size:17px;margin-bottom:12px;">Registered Ingredients (${ingredientsCache.length})</h2>
        <div class="row-flex" style="gap:8px;">
          <input id="ingNameSearch" placeholder="Search by ingredient name..." style="flex:1;min-width:140px;">
          <input id="ingSupplierSearch" placeholder="Search by supplier name..." style="flex:1;min-width:140px;">
        </div>
        <div id="ingredientList" style="margin-top:10px;max-height:520px;overflow-y:auto;">${ingredientsCache.length ? '' : '<div class="empty">No ingredients registered yet.</div>'}</div>
      </div>
    </div>
  `;
  renderIngredientTable('', '');
  document.getElementById('ingNameSearch').addEventListener('input', () => runIngredientSearch());
  document.getElementById('ingSupplierSearch').addEventListener('input', () => runIngredientSearch());
  function runIngredientSearch(){
    renderIngredientTable(document.getElementById('ingNameSearch').value, document.getElementById('ingSupplierSearch').value);
  }

  let currentImageBase64 = null, currentAnalysis = null;
  const dz = document.getElementById('dz'), fileInput = document.getElementById('fileInput');
  const preview = document.getElementById('preview'), previewImg = document.getElementById('previewImg');
  const analyzeBtn = document.getElementById('analyzeBtn');

  const cancelBtn = document.getElementById('cancelReverifyBtn');
  if(cancelBtn) cancelBtn.onclick = () => { reverifyTarget = null; renderIngredientsView(); };

  const noPhotoToggleBtn = document.getElementById('noPhotoToggleBtn');
  if(noPhotoToggleBtn){
    noPhotoToggleBtn.onclick = () => {
      const form = document.getElementById('noPhotoForm');
      form.style.display = form.style.display === 'none' ? 'block' : 'none';
    };
    const noPhotoIsFree = document.getElementById('noPhotoIsFree');
    const noPhotoDietRow = document.getElementById('noPhotoDietRow');
    noPhotoIsFree.onchange = () => { noPhotoDietRow.style.display = 'block'; }; // diet category still useful even when free
    document.getElementById('noPhotoSaveBtn').onclick = async () => {
      const name = document.getElementById('noPhotoName').value.trim();
      if(!name){ alert('Please enter an ingredient name.'); return; }
      const isFree = noPhotoIsFree.checked;
      const dietCategory = document.getElementById('noPhotoDietCategory').value || null;
      try{
        await api('/api/ingredients', {method:'POST', body: JSON.stringify({name, allergens: [], isFree, dietCategory})});
      }catch(e){ alert(e.message); return; }
      await loadIngredients();
      renderIngredientsView();
    };
  }

  dz.onclick = () => fileInput.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = () => dz.classList.remove('drag');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  fileInput.onchange = e => { if(e.target.files[0]) handleFile(e.target.files[0]); };

  function handleFile(file){
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1200;
        let {width,height} = img;
        if(width>maxDim || height>maxDim){ const s=maxDim/Math.max(width,height); width=Math.round(width*s); height=Math.round(height*s); }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        currentImageBase64 = canvas.toDataURL('image/jpeg',0.88).split(',')[1];
        previewImg.src = canvas.toDataURL('image/jpeg',0.88);
        preview.style.display='block';
        analyzeBtn.disabled = false;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  analyzeBtn.onclick = async () => {
    analyzeBtn.disabled = true;
    document.getElementById('analyzeStatus').innerHTML = '<span class="spinner"></span> Analyzing...';
    document.getElementById('analyzeResult').innerHTML = '';
    try{
      currentAnalysis = await api('/api/ingredients/analyze', {method:'POST', body: JSON.stringify({imageBase64: currentImageBase64})});
      document.getElementById('analyzeStatus').textContent = '';
      document.getElementById('analyzeResult').innerHTML = `
        <label>Ingredient name</label>
        <input id="newIngName" placeholder="e.g. Soy Sauce, Curry (generic name)" value="${reverifyTarget ? escapeHtml(reverifyTarget.name) : ''}">
        <div style="font-size:12px;color:var(--ink-soft);margin:10px 0 4px;">Detected allergens</div>
        <div>${allergenTagsHtml(currentAnalysis.allergens, 26)}</div>
        ${currentAnalysis.notes ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-top:8px;">${escapeHtml(currentAnalysis.notes)}</div>` : ''}
        <label>Diet category (for Vegetarian/Vegan)</label>
        <select id="newIngDietCategory">
          ${Object.entries(DIET_CATEGORY_LABELS).map(([v,l]) => `<option value="${v}" ${reverifyTarget && (reverifyTarget.diet_category||'')===v ? 'selected':''}>${l}</option>`).join('')}
        </select>

        <label style="display:flex;align-items:center;gap:7px;margin-top:16px;cursor:pointer;">
          <input type="checkbox" id="isFreeIngredient" style="width:auto;" ${reverifyTarget && reverifyTarget.is_free ? 'checked':''}> This ingredient is free (e.g. tap water) — don't track cost
        </label>

        <label style="display:flex;align-items:center;gap:7px;margin-top:10px;cursor:pointer;">
          <input type="checkbox" id="isSupplierProduct" style="width:auto;" ${reverifyTarget && reverifyTarget.supplier_id ? 'checked':''}> Is this a specific supplier's product?
        </label>
        <div id="supplierFields" style="display:${reverifyTarget && reverifyTarget.supplier_id ? 'block':'none'};margin-top:8px;">
          <label>Product code (from invoice)</label>
          <input id="newIngCode" placeholder="e.g. CR-4521" value="${reverifyTarget && reverifyTarget.product_code ? escapeHtml(reverifyTarget.product_code) : ''}">
          <div id="codeLookupMsg" style="font-size:12.5px;margin-top:4px;"></div>
          <label>Supplier</label>
          <select id="newIngSupplier">
            <option value="">Select...</option>
            ${suppliersCache.map(s => `<option value="${s.id}" ${reverifyTarget && reverifyTarget.supplier_id===s.id ? 'selected':''}>${escapeHtml(s.name)}</option>`).join('')}
            <option value="__new__">+ Add new supplier</option>
          </select>
          <input id="newSupplierName" placeholder="New supplier name" style="display:none;margin-top:6px;">
          <div class="row-flex" style="gap:8px;margin-top:8px;">
            <div style="flex:1;min-width:100px;">
              <label>Package price</label>
              <input id="newIngPrice" type="number" step="0.01" placeholder="e.g. 76.00" value="${reverifyTarget && reverifyTarget.price!=null ? reverifyTarget.price : ''}">
            </div>
            <div style="flex:1;min-width:80px;">
              <label>Package size</label>
              <input id="newIngPackageQty" type="number" step="any" placeholder="e.g. 20" value="${reverifyTarget && reverifyTarget.package_qty!=null ? reverifyTarget.package_qty : ''}">
            </div>
            <div style="flex:1;min-width:70px;">
              <label>Unit</label>
              <select id="newIngUnit">
                ${UNIT_OPTIONS.map(u => `<option value="${u}" ${reverifyTarget && reverifyTarget.unit===u ? 'selected':''}>${u}</option>`).join('')}
              </select>
            </div>
          </div>
          <p style="font-size:11.5px;color:var(--ink-soft);margin:6px 0 0;">e.g. price $76, size 20, unit kg = a 20kg bag costs $76</p>
        </div>
        <button class="primary" style="width:100%;margin-top:12px;" id="saveIngBtn">${reverifyTarget ? 'Save Re-verification' : 'Save this result'}</button>
      `;

      const freeToggle = document.getElementById('isFreeIngredient');
      const toggle = document.getElementById('isSupplierProduct');
      const fields = document.getElementById('supplierFields');
      toggle.onchange = () => { fields.style.display = toggle.checked ? 'block' : 'none'; };
      freeToggle.onchange = () => {
        if(freeToggle.checked){ toggle.checked = false; fields.style.display = 'none'; }
      };

      const codeInput = document.getElementById('newIngCode');
      codeInput.addEventListener('blur', async () => {
        const code = codeInput.value.trim();
        const msgEl = document.getElementById('codeLookupMsg');
        if(!code){ msgEl.textContent=''; return; }
        const res = await api('/api/ingredients/lookup?code=' + encodeURIComponent(code));
        if(res.ingredient){
          msgEl.style.color = 'var(--warn)';
          msgEl.textContent = `This product code is already registered (${res.ingredient.name} · ${res.ingredient.supplier_name||''}). Saving will create a separate entry.`;
        } else {
          msgEl.style.color = 'var(--safe)';
          msgEl.textContent = 'This product code is not registered yet.';
        }
      });

      document.getElementById('newIngSupplier').onchange = (e) => {
        document.getElementById('newSupplierName').style.display = e.target.value === '__new__' ? 'block' : 'none';
      };

      document.getElementById('saveIngBtn').onclick = async () => {
        const name = document.getElementById('newIngName').value.trim();
        if(!name){ alert('Please enter an ingredient name.'); return; }
        const dietCategory = document.getElementById('newIngDietCategory').value || null;
        const isFree = freeToggle.checked;

        let supplierId = null, productCode = null, price = null, unit = null, packageQty = null, supplierTouched = true;
        if(toggle.checked && !isFree){
          productCode = document.getElementById('newIngCode').value.trim() || null;
          const priceVal = document.getElementById('newIngPrice').value;
          price = priceVal ? parseFloat(priceVal) : null;
          const pkgVal = document.getElementById('newIngPackageQty').value;
          packageQty = pkgVal ? parseFloat(pkgVal) : null;
          unit = document.getElementById('newIngUnit').value || null;
          const supplierSelect = document.getElementById('newIngSupplier').value;
          if(supplierSelect === '__new__'){
            const newName = document.getElementById('newSupplierName').value.trim();
            if(!newName){ alert('Please enter a new supplier name.'); return; }
            const r = await api('/api/suppliers', {method:'POST', body: JSON.stringify({name:newName})});
            supplierId = r.supplier.id;
            await loadSuppliers();
          } else if(supplierSelect){
            supplierId = supplierSelect;
          }
        } else if(reverifyTarget && !isFree){
          // Re-verifying and the supplier checkbox is unchecked: leave supplier/code/price/unit untouched.
          supplierTouched = false;
        }

        const body = {
          name, rawText: currentAnalysis.raw_text, allergens: currentAnalysis.allergens,
          overallConfidence: currentAnalysis.overall_confidence, notes: currentAnalysis.notes,
          photoBase64: currentImageBase64, dietCategory, isFree,
        };
        if(isFree){ body.supplierId = null; body.productCode = null; body.price = null; body.unit = null; body.packageQty = null; }
        else if(supplierTouched){ body.supplierId = supplierId; body.productCode = productCode; body.price = price; body.unit = unit; body.packageQty = packageQty; }

        try{
          if(reverifyTarget){
            await api('/api/ingredients/'+reverifyTarget.id, {method:'PUT', body: JSON.stringify(body)});
          } else {
            await api('/api/ingredients', {method:'POST', body: JSON.stringify(body)});
          }
        }catch(e){ alert(e.message); return; }
        reverifyTarget = null;
        await loadIngredients();
        renderIngredientsView();
      };
    }catch(e){
      document.getElementById('analyzeStatus').textContent = '';
      document.getElementById('analyzeResult').innerHTML = `<div class="error-box" style="display:block;">${escapeHtml(e.message)}</div>`;
    }finally{
      analyzeBtn.disabled = false;
    }
  };
}

          <td><b>${escapeHtml(s.name)}</b></td>
          <td>${allergenTagsHtml(s.allergens)}</td>
          <td style="font-size:12.5px;font-family:'IBM Plex Mono',monospace;">${subRecipeCostHtml(s.costing)}</td>
          <td><button class="danger" data-del-sr="${s.id}">Delete</button></td>
        </tr>`).join('')}
    </tbody></table>`;
    listEl.querySelectorAll('[data-del-sr]').forEach(btn=>{
      btn.onclick = async () => {
        if(!confirm('Delete this sub-recipe? Menu items using it will lose those allergens.')) return;
        await api('/api/sub-recipes/'+btn.dataset.delSr, {method:'DELETE'});
        await loadSubRecipes(); renderSubRecipesView();
      };
    });
  }
}

function subRecipeCostHtml(costing){
  if(!costing || costing.costIncomplete) return '<span style="color:var(--ink-soft);font-family:inherit;">incomplete</span>';
  return `$${costing.totalCost.toFixed(2)} total<br><span style="color:var(--ink-soft);">$${costing.unitCost.toFixed(4)}/${costing.unitFamily==='weight'?'g':costing.unitFamily==='volume'?'ml':'each'}</span>`;
}

function menuCostSummaryHtml(costing){
  if(!costing || costing.costIncomplete) return 'cost: incomplete';
  let s = `$${costing.foodCost.toFixed(2)}`;
  if(costing.foodCostPercent != null) s += ` (${costing.foodCostPercent}%)`;
  return s;
}

function menuCostDetailHtml(costing){
  if(!costing) return '';
  if(costing.costIncomplete){
    const missing = (costing.missingCostItems||[]).length
      ? `Missing cost data for: ${costing.missingCostItems.map(escapeHtml).join(', ')}.`
      : `Add quantities/units to this menu\'s ingredients to compute cost.`;
    return `<span style="color:var(--warn);">Food cost: incomplete.</span> <span style="color:var(--ink-soft);">${missing}</span>`;
  }
  let s = `<b>Food cost: $${costing.foodCost.toFixed(2)}</b>`;
  if(costing.foodCostPercent != null) s += ` <span style="color:var(--ink-soft);">(${costing.foodCostPercent}% of selling price)</span>`;
  return s;
}

// ---------- Invoices (price check) ----------
function renderInvoicesView(){
  const el = document.getElementById('view-invoices');
  el.innerHTML = `
    <div class="panel">
      <h2 style="font-size:17px;margin-bottom:4px;">Check Invoice & Log Purchase</h2>
      <p style="font-size:12.5px;color:var(--ink-soft);margin:0 0 10px;">Upload a photo of a supplier invoice. We'll read quantities and prices, compare against what's registered, and let you log it as a purchase for this month's spend report.</p>
      <div class="dropzone" id="invDz">Drag & drop an invoice photo, or click to select</div>
      <input type="file" id="invFileInput" accept="image/*" capture="environment">
      <div class="preview" id="invPreview"><img id="invPreviewImg"></div>
      <button class="primary" style="width:100%;margin-top:10px;" id="invAnalyzeBtn" disabled>Check Invoice</button>
      <div id="invStatus" style="font-size:13px;color:var(--ink-soft);margin-top:8px;"></div>
      <div id="invResult" style="margin-top:14px;"></div>
    </div>
  `;

  let invImageBase64 = null;
  let currentInvoiceItems = null;
  let currentDetectedSupplier = null;
  const dz = document.getElementById('invDz'), fileInput = document.getElementById('invFileInput');
  const preview = document.getElementById('invPreview'), previewImg = document.getElementById('invPreviewImg');
  const analyzeBtn = document.getElementById('invAnalyzeBtn');

  dz.onclick = () => fileInput.click();
  dz.ondragover = e => { e.preventDefault(); dz.classList.add('drag'); };
  dz.ondragleave = () => dz.classList.remove('drag');
  dz.ondrop = e => { e.preventDefault(); dz.classList.remove('drag'); if(e.dataTransfer.files[0]) handleFile(e.dataTransfer.files[0]); };
  fileInput.onchange = e => { if(e.target.files[0]) handleFile(e.target.files[0]); };

  function handleFile(file){
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        const maxDim = 1600; // invoices have more text than a label, allow a bit more resolution
        let {width,height} = img;
        if(width>maxDim || height>maxDim){ const s=maxDim/Math.max(width,height); width=Math.round(width*s); height=Math.round(height*s); }
        const canvas = document.createElement('canvas');
        canvas.width=width; canvas.height=height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        invImageBase64 = canvas.toDataURL('image/jpeg',0.9).split(',')[1];
        previewImg.src = canvas.toDataURL('image/jpeg',0.9);
        preview.style.display='block';
        analyzeBtn.disabled = false;
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  analyzeBtn.onclick = async () => {
    analyzeBtn.disabled = true;
    document.getElementById('invStatus').innerHTML = '<span class="spinner"></span> Reading invoice...';
    document.getElementById('invResult').innerHTML = '';
    try{
      const res = await api('/api/invoices/analyze', {method:'POST', body: JSON.stringify({imageBase64: invImageBase64})});
      document.getElementById('invStatus').textContent = '';
      currentInvoiceItems = res.items;
      currentDetectedSupplier = res.detectedSupplierName;
      renderInvoiceResults(res.items, res.detectedSupplierName);
    }catch(e){
      document.getElementById('invStatus').textContent = '';
      document.getElementById('invResult').innerHTML = `<div class="error-box" style="display:block;">${escapeHtml(e.message)}</div>`;
    }finally{
      analyzeBtn.disabled = false;
    }
  };

  function renderInvoiceResults(items, detectedSupplierName){
    const box = document.getElementById('invResult');
    if(!items.length){ box.innerHTML = '<div class="empty">No line items could be read from this photo.</div>'; return; }
    const supplierLine = detectedSupplierName
      ? `<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">Detected issuing supplier: <b>${escapeHtml(detectedSupplierName)}</b></div>`
      : `<div style="font-size:12.5px;color:var(--ink-soft);margin-bottom:10px;">Issuing supplier name not detected.</div>`;
    box.innerHTML = supplierLine + `<table><thead><tr><th>Invoice Item</th><th>Code</th><th>Matched Ingredient</th><th>Qty</th><th>Unit Price</th><th>Line Total</th><th></th></tr></thead><tbody>
      ${items.map((it, idx) => {
        let priceCell, actionCell = '';
        if(!it.matchedIngredientId){
          priceCell = `<span style="color:var(--ink-soft);">Not registered</span>`;
        } else if(it.priceChanged){
          priceCell = `<span style="color:var(--danger);font-weight:600;">$${it.currentPrice} → $${it.unitPrice}</span>`;
          actionCell = `<button class="ghost" data-apply-price="${idx}" style="font-size:11px;padding:5px 9px;">Update Price</button>`;
        } else if(it.currentPrice != null){
          priceCell = `<span style="color:var(--safe);">$${it.currentPrice}</span>`;
        } else if(it.unitPrice != null){
          priceCell = `$${it.unitPrice}`;
        } else {
          priceCell = `<span style="color:var(--ink-soft);">—</span>`;
        }
        const mismatchRow = it.supplierMismatch
          ? `<tr><td colspan="7" style="border-top:none;padding-top:0;"><span class="tag" style="background:var(--warn-soft);color:var(--warn);">⚠ Registered supplier for this ingredient is "${escapeHtml(it.registeredSupplierName)}" — this invoice looks like it's from a different company. Double-check before updating the price.</span></td></tr>`
          : '';
        return `<tr>
          <td>${escapeHtml(it.invoiceName||'')}</td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${escapeHtml(it.productCode||'—')}</td>
          <td>${it.matchedName ? escapeHtml(it.matchedName) : '<span style="color:var(--ink-soft);">No match</span>'}</td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${it.quantity != null ? it.quantity : '—'}</td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${priceCell}</td>
          <td style="font-family:'IBM Plex Mono',monospace;font-size:12px;">${it.lineTotal != null ? '$'+it.lineTotal.toFixed(2) : '—'}</td>
          <td>${actionCell}</td>
        </tr>${mismatchRow}`;
      }).join('')}
    </tbody></table>
    <div class="row-flex" style="gap:8px;margin-top:14px;align-items:flex-end;">
      <div style="flex:1;min-width:140px;">
        <label>Invoice date</label>
        <input id="purchaseDate" type="date" value="${new Date().toISOString().slice(0,10)}">
      </div>
      <button class="primary" id="logPurchaseBtn">Log as Purchase</button>
    </div>
    <div id="logPurchaseStatus" style="font-size:13px;margin-top:8px;"></div>
    `;

    box.querySelectorAll('[data-apply-price]').forEach(btn => {
      btn.onclick = async () => {
        const it = items[parseInt(btn.dataset.applyPrice)];
        await api('/api/ingredients/'+it.matchedIngredientId, {method:'PUT', body: JSON.stringify({price: it.unitPrice})});
        await loadIngredients();
        btn.outerHTML = '<span style="color:var(--safe);font-size:12px;">Updated</span>';
      };
    });

    document.getElementById('logPurchaseBtn').onclick = async () => {
      const btn = document.getElementById('logPurchaseBtn');
      btn.disabled = true;
      const statusEl = document.getElementById('logPurchaseStatus');
      statusEl.innerHTML = '<span class="spinner"></span> Saving...';
      try{
        const date = document.getElementById('purchaseDate').value;
        const res = await api('/api/purchases', {method:'POST', body: JSON.stringify({
          date, supplierName: currentDetectedSupplier, lineItems: currentInvoiceItems,
        })});
        statusEl.innerHTML = `<span style="color:var(--safe);">Logged $${res.purchase.total_amount.toFixed(2)} as a purchase on ${res.purchase.date}.</span>`;
      }catch(e){
        statusEl.innerHTML = `<span style="color:var(--danger);">${escapeHtml(e.message)}</span>`;
      }finally{
        btn.disabled = false;
      }
    };
  }
}

          <td style="font-size:12.5px;color:var(--ink-soft);">${formatDate(l.created_at)}</td>
          <td><b>${escapeHtml(l.user_name)}</b></td>
          <td>${actionLabel[l.action]||l.action} · ${typeLabel[l.target_type]||l.target_type}</td>
          <td>${escapeHtml(l.target_name)}</td>
        </tr>`).join('')}
      </tbody></table>` : '<div class="empty">No records yet.</div>'}
    </div>
  `;
}

function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }
function formatDate(iso){ if(!iso) return ''; const d = new Date(iso); return d.toLocaleString('en-NZ', {dateStyle:'medium', timeStyle:'short'}); }

function tickClock(){
  const el = document.getElementById('clockDisplay');
  if(!el) return;
  const now = new Date();
  const datePart = now.toLocaleDateString('en-NZ', {weekday:'short', day:'2-digit', month:'short', year:'numeric'});
  const timePart = now.toLocaleTimeString('en-NZ', {hour:'2-digit', minute:'2-digit', second:'2-digit', hour12:false});
  el.textContent = `${datePart} · ${timePart}`;
}
setInterval(tickClock, 1000);
tickClock();

boot();
</script>
</body>
</html>
