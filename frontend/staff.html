<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Allergen Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F6F1;--panel:#FFFFFF;--ink:#1E2A26;--ink-soft:#55635C;--border:#DBDFD3;
    --accent:#2F6F5E;--accent-soft:#E4EEE9;--warn:#B5501B;--warn-soft:#F7E9DE;--danger:#A32B2B;--danger-soft:#F8E3E1;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  h1{font-family:'Newsreader',serif;font-weight:700;font-size:26px;margin:4px 0 4px;}
  .sub{color:var(--ink-soft);font-size:14px;margin-bottom:22px;}
  input#search{
    width:100%;padding:14px 16px;font-size:16px;border:1.5px solid var(--border);border-radius:10px;
    font-family:inherit;background:#fff;
  }
  .item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    padding:16px 18px;margin-top:12px;
  }
  .item .name{font-family:'Newsreader',serif;font-weight:600;font-size:18px;}
  .tag{display:inline-flex;padding:5px 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--warn-soft);color:var(--warn);margin:6px 6px 0 0;}
  .more-toggle{display:inline-block;margin:6px 6px 0 0;}
  .more-toggle summary{list-style:none;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .more-toggle summary::-webkit-details-marker{display:none;}
  .safe-note{color:var(--accent);font-size:13.5px;margin-top:8px;font-weight:500;}
  .empty{color:var(--ink-soft);text-align:center;padding:40px 10px;font-size:14px;}
  .error-box{background:var(--danger-soft);color:var(--danger);padding:16px;border-radius:10px;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub" id="companyLabel" style="font-weight:600;color:var(--accent);"></div>
  <h1>Menu Allergen Check</h1>
  <div class="sub">Search a menu item to see registered allergens.</div>
  <input id="search" placeholder="Search menu item...">
  <div id="results"></div>
</div>
<script>
const slug = location.pathname.split('/').pop();
const code = new URLSearchParams(location.search).get('code') || '';
let allItems = [];

async function load(){
  try{
    const res = await fetch(`/api/staff/${slug}/menu?code=${encodeURIComponent(code)}`);
    const data = await res.json();
    if(!res.ok){
      document.getElementById('results').innerHTML = `<div class="error-box">${data.error || 'Access denied.'}</div>`;
      return;
    }
    document.getElementById('companyLabel').textContent = data.companyName;
    allItems = data.menuItems;
    render(allItems);
  }catch(e){
    document.getElementById('results').innerHTML = `<div class="error-box">Something went wrong while loading.</div>`;
  }
}

function allergenTagsHtml(allergens, maxShow){
  maxShow = maxShow || 6;
  if(!allergens.length) return '<div class="safe-note">No registered allergens</div>';
  const shown = allergens.slice(0, maxShow);
  const rest = allergens.slice(maxShow);
  let html = shown.map(a => `<span class="tag">${escapeHtml(a.name)}</span>`).join('');
  if(rest.length){
    html += `<details class="more-toggle"><summary>+${rest.length} more</summary>${rest.map(a => `<span class="tag">${escapeHtml(a.name)}</span>`).join('')}</details>`;
  }
  return html;
}

function dietBadgesHtml(dietFlags){
  if(!dietFlags) return '';
  const badge = (ok, label, culprits) => {
    if(ok) return `<span class="tag" style="background:var(--accent-soft);color:var(--accent);">${label}</span>`;
    const maxNames = 3;
    let names = (culprits||[]).slice(0, maxNames).map(escapeHtml).join(', ');
    if((culprits||[]).length > maxNames) names += `, +${culprits.length - maxNames} more`;
    const why = names ? ` (has: ${names})` : '';
    return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Not ${label}${why}</span>`;
  };
  return `<div style="margin-top:8px;">${badge(dietFlags.glutenFree, 'Gluten Free', dietFlags.glutenCulprits)}${badge(dietFlags.dairyFree, 'Dairy Free', dietFlags.dairyCulprits)}</div>`;
}

function render(items){
  const el = document.getElementById('results');
  if(!items.length){ el.innerHTML = '<div class="empty">No matching menu items.</div>'; return; }
  el.innerHTML = items.map(m => `
    <div class="item">
      <div class="name">${escapeHtml(m.name)}</div>
      ${allergenTagsHtml(m.allergens)}
      ${dietBadgesHtml(m.dietFlags)}
    </div>
  `).join('');
}

document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.trim().toLowerCase();
  render(q ? allItems.filter(m => m.name.toLowerCase().includes(q)) : allItems);
});

function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }
load();
</script>
</body>
</html>
