<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Menu Allergen Check</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,600;0,700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#15120F;--bg-glow:radial-gradient(ellipse 900px 500px at 15% -10%, rgba(127,168,201,0.09), transparent 60%),
                 radial-gradient(ellipse 700px 500px at 100% 0%, rgba(201,154,82,0.06), transparent 55%);
    --panel:rgba(243,238,228,0.035);--ink:#F3EEE4;--ink-soft:#A79E8F;--border:rgba(243,238,228,0.12);
    --accent:#7FA8C9;--accent-soft:rgba(127,168,201,0.14);--warn:#C99A52;--warn-soft:rgba(201,154,82,0.14);
    --danger:#C97064;--danger-soft:rgba(201,112,100,0.14);
  }
  *{box-sizing:border-box;}
  body{margin:0;background-color:var(--bg);background-image:var(--bg-glow);color:var(--ink);font-family:'IBM Plex Sans',sans-serif;min-height:100vh;}
  .wrap{max-width:640px;margin:0 auto;padding:28px 18px 60px;}
  h1{font-family:'Newsreader',serif;font-weight:700;font-size:26px;margin:4px 0 4px;}
  .sub{color:var(--ink-soft);font-size:14px;margin-bottom:16px;}
  input#search{
    width:100%;padding:14px 16px;font-size:16px;border:1.5px solid var(--border);border-radius:10px;
    font-family:inherit;background:rgba(243,238,228,0.04);color:var(--ink);box-sizing:border-box;
  }
  input#search::placeholder{color:#6B655B;}
  input#search:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft);}
  .filter-row{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 4px;}
  .filter-btn{
    padding:8px 14px;border-radius:20px;border:1.5px solid var(--border);background:rgba(243,238,228,0.03);
    font-family:inherit;font-size:13px;font-weight:600;color:var(--ink-soft);cursor:pointer;
  }
  .filter-btn.on{background:var(--accent);border-color:var(--accent);color:#141210;}
  .glossary-toggle{
    background:none;border:none;color:var(--accent);font-family:inherit;font-size:12.5px;
    cursor:pointer;padding:4px 0;margin-top:2px;
  }
  .glossary-box{margin-top:8px;}
  .glossary-item{
    background:var(--panel);border:1px solid var(--border);border-radius:10px;
    margin-bottom:8px;overflow:hidden;backdrop-filter:blur(14px);
  }
  .glossary-item summary{
    list-style:none;cursor:pointer;padding:11px 16px;font-weight:600;font-size:14px;
    display:flex;align-items:center;justify-content:space-between;
  }
  .glossary-item summary::-webkit-details-marker{display:none;}
  .glossary-item summary::after{content:'+';color:var(--ink-soft);font-weight:400;}
  .glossary-item[open] summary::after{content:'–';}
  .glossary-item .body{padding:0 16px 14px;font-size:13px;color:var(--ink-soft);line-height:1.55;}
  .glossary-item .body b{color:var(--ink);}
  .item{
    background:var(--panel);border:1px solid var(--border);border-radius:12px;
    padding:0;margin-top:12px;overflow:hidden;backdrop-filter:blur(14px);box-shadow:0 10px 30px rgba(0,0,0,0.3);
  }
  .item summary{
    list-style:none;cursor:pointer;padding:14px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;
  }
  .item summary::-webkit-details-marker{display:none;}
  .item summary::after{content:'+';font-size:20px;color:var(--ink-soft);flex-shrink:0;}
  .item[open] summary::after{content:'–';}
  .item .name{font-family:'Newsreader',serif;font-weight:600;font-size:17px;}
  .dot-row{display:flex;gap:5px;flex-shrink:0;}
  .dot{width:9px;height:9px;border-radius:50%;display:inline-block;}
  .item-detail{padding:0 18px 16px;}
  .tag{display:inline-flex;padding:5px 12px;border-radius:16px;font-size:13px;font-weight:600;background:var(--warn-soft);color:var(--warn);margin:6px 6px 0 0;}
  .more-toggle{display:inline-block;margin:6px 6px 0 0;}
  .more-toggle summary{list-style:none;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
  .more-toggle summary::-webkit-details-marker{display:none;}
  .safe-note{color:var(--accent);font-size:13.5px;margin-top:8px;font-weight:500;}
  .empty{color:var(--ink-soft);text-align:center;padding:40px 10px;font-size:14px;}
  .error-box{background:var(--danger-soft);color:var(--danger);padding:16px;border-radius:10px;font-size:14px;}
</style>
</head>
<body>
<div class="wrap">
  <div class="sub" id="companyLabel" style="font-weight:600;color:var(--accent);"></div>
  <h1>Menu Allergen Check</h1>
  <div class="sub">Search a menu item, or filter by diet, to see registered allergens.</div>
  <input id="search" placeholder="Search menu item...">
  <div class="filter-row" id="filterRow"></div>
  <button type="button" id="glossaryToggleBtn" class="glossary-toggle">What do these mean? ▾</button>
  <div id="glossaryBox" style="display:none;"></div>
  <div id="results"></div>
</div>
<script>
const slug = location.pathname.split('/').pop();
const code = new URLSearchParams(location.search).get('code') || '';
let allItems = [];
let activeFilters = new Set();

const FILTER_DEFS = [
  {id:'glutenFree', label:'Gluten Free', source:'diet'},
  {id:'dairyFree', label:'Dairy Free', source:'diet'},
  {id:'nutFree', label:'Nut Free', source:'diet'},
  {id:'shellfishFree', label:'Shellfish Free', source:'diet'},
  {id:'vegetarian', label:'Vegetarian', source:'veg'},
  {id:'vegan', label:'Vegan', source:'veg'},
];

const GLOSSARY = [
  {
    label: 'Gluten Free',
    definition: 'Gluten is a protein found in wheat and related grains. People with coeliac disease or a gluten intolerance need to avoid it completely — even a small trace can make them unwell.',
    examples: 'Wheat, wheat flour, barley, rye, oats, malt, bread, pasta, flour tortillas, couscous, beer, most breadcrumbs, many sauces and gravies thickened with flour.',
  },
  {
    label: 'Dairy Free',
    definition: 'Dairy means milk and anything made from milk. This matters both for people with a milk allergy (an immune reaction) and lactose intolerance (difficulty digesting milk sugar).',
    examples: 'Milk, butter, cheese, cream, yoghurt, whey, casein, ghee, condensed milk, ice cream, many creamy sauces and desserts.',
  },
  {
    label: 'Nut Free',
    definition: 'Covers both peanuts (technically a legume) and tree nuts. Nut allergies are among the most common — and can be among the most severe — food allergies.',
    examples: 'Peanuts, peanut oil, almonds, cashews, walnuts, hazelnuts, pistachios, macadamias, pecans, pine nuts, brazil nuts, satay sauce, pesto, praline, nut-based milks.',
  },
  {
    label: 'Shellfish Free',
    definition: 'Covers crustaceans (like prawns and crab) and molluscs (like mussels and squid). Reactions to shellfish are common in adults and can be severe.',
    examples: 'Prawns, crab, lobster, crayfish, mussels, oysters, squid/calamari, scallops, fish sauce, oyster sauce, shrimp paste.',
  },
  {
    label: 'Vegetarian',
    definition: 'No meat, poultry, or fish/seafood. Vegetarians typically still eat dairy, eggs, and honey — it\'s about avoiding animal flesh, not all animal products.',
    examples: 'Avoid: beef, chicken, pork, lamb, fish, prawns, bacon, gelatine (often made from animal bones), lard, stock made from meat or fish.',
  },
  {
    label: 'Vegan',
    definition: 'No animal products at all — not just meat and fish, but also dairy, eggs, honey, and anything else derived from an animal.',
    examples: 'Everything avoided for Vegetarian, plus: milk, cheese, butter, cream, eggs, honey, mayonnaise, and some wines/beers (filtered using animal products).',
  },
  {
    label: 'Lupin',
    definition: 'Lupin is a legume related to peanuts, sometimes milled into flour or used as a protein source — especially in gluten-free baking. It\'s less well known than the "big" allergens but reactions can be severe, and it isn\'t always obvious it\'s in a product.',
    examples: 'Lupin flour, lupin seeds, some gluten-free breads and pasta, some vegetarian meat substitutes, certain European-style baked goods.',
  },
  {
    label: 'Sulphites',
    definition: 'Sulphites are preservatives added to stop food and drink from spoiling or browning. They don\'t cause a classic food allergy, but sensitive people — especially with asthma — can have breathing reactions.',
    examples: 'Wine, beer, cider, dried fruit (apricots, raisins, sultanas), pickled vegetables, some sausages and processed meats, vinegar, some cordials and soft drinks.',
  },
  {
    label: 'Coeliac Disease',
    definition: 'Coeliac disease is not a typical allergy — it\'s an autoimmune condition. When someone with coeliac disease eats gluten, their immune system mistakenly attacks their own small intestine. There is no "safe small amount" — even trace, repeated exposure causes ongoing damage, even if the person doesn\'t feel sick straight away.',
    examplesLabel: 'Why this matters in the kitchen:',
    examples: 'Cross-contamination counts, not just ingredients. The same toaster, fryer oil, chopping board, or utensil used for gluten food can be enough — even with zero gluten ingredients in the dish itself.',
  },
  {
    label: 'Anaphylaxis',
    definition: 'Anaphylaxis is a severe, whole-body allergic reaction that can develop within minutes — swelling of the throat, difficulty breathing, and a dangerous drop in blood pressure. It is a medical emergency and can be life-threatening without immediate treatment (usually an adrenaline/EpiPen injection).',
    examplesLabel: 'Why this matters in the kitchen:',
    examples: 'Most often triggered by nuts and shellfish, but can happen with any allergen in a sensitive person. Even a small trace from shared equipment, oil, or utensils can be enough to trigger it — this is why we always disclose every allergen present, not just the obvious ones.',
  },
  {
    label: 'Nightshade Allergy / Sensitivity',
    definition: 'Nightshades are a plant family that includes tomatoes, potatoes, eggplant, capsicum/peppers, and chilli. Some people report sensitivity to them — sometimes linked to inflammatory conditions like arthritis — though this is not one of the officially regulated allergens under the NZ/AU Food Standards Code, and the scientific evidence is limited. If a guest says they avoid nightshades, take it just as seriously as any other dietary request — but note it isn\'t tracked as a registered allergen in this system the way Gluten, Dairy, Nut, and Shellfish are, so double-check ingredients directly with the kitchen.',
    examplesLabel: 'Common nightshade foods:',
    examples: 'Tomatoes (including tomato sauce, paste, and ketchup), potatoes (not sweet potatoes), eggplant/aubergine, capsicum/bell peppers, chilli peppers, paprika, cayenne pepper, some spice blends.',
  },
];

function renderGlossary(){
  document.getElementById('glossaryBox').innerHTML = GLOSSARY.map(g => `
    <details class="glossary-item">
      <summary>${escapeHtml(g.label)}</summary>
      <div class="body">
        ${escapeHtml(g.definition)}<br><br>
        <b>${escapeHtml(g.examplesLabel || 'Common foods to look out for:')}</b> ${escapeHtml(g.examples)}
      </div>
    </details>
  `).join('');
}
renderGlossary();

document.getElementById('glossaryToggleBtn').onclick = () => {
  const box = document.getElementById('glossaryBox');
  const btn = document.getElementById('glossaryToggleBtn');
  const showing = box.style.display !== 'none';
  box.style.display = showing ? 'none' : 'block';
  btn.textContent = showing ? 'What do these mean? ▾' : 'What do these mean? ▴';
};


function renderFilterRow(){
  const row = document.getElementById('filterRow');
  row.innerHTML = FILTER_DEFS.map(f => `<button type="button" class="filter-btn ${activeFilters.has(f.id)?'on':''}" data-f="${f.id}">${f.label}</button>`).join('');
  row.querySelectorAll('[data-f]').forEach(btn => {
    btn.onclick = () => {
      const id = btn.dataset.f;
      if(activeFilters.has(id)) activeFilters.delete(id); else activeFilters.add(id);
      renderFilterRow();
      applyAndRender();
    };
  });
}

async function load(){
  try{
    const res = await fetch(`/api/staff/${slug}/menu?code=${encodeURIComponent(code)}`);
    const data = await res.json();
    if(!res.ok){
      document.getElementById('results').innerHTML = `<div class="error-box">${data.error || 'Access denied.'}</div>`;
      return;
    }
    document.getElementById('companyLabel').textContent = data.companyName;
    allItems = data.menuItems;
    renderFilterRow();
    applyAndRender();
  }catch(e){
    document.getElementById('results').innerHTML = `<div class="error-box">Something went wrong while loading.</div>`;
  }
}

function itemMatchesFilters(item){
  for(const id of activeFilters){
    const def = FILTER_DEFS.find(f => f.id === id);
    const val = def.source === 'diet' ? (item.dietFlags||{})[id] : (item.vegFlags||{})[id];
    if(val !== true) return false;
  }
  return true;
}

function applyAndRender(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  const filtered = allItems.filter(m => (!q || m.name.toLowerCase().includes(q)) && itemMatchesFilters(m));
  render(filtered);
}

function allergenTagsHtml(allergens, maxShow){
  maxShow = maxShow || 6;
  if(!allergens.length) return '<div class="safe-note">No registered allergens</div>';
  const shown = allergens.slice(0, maxShow);
  const rest = allergens.slice(maxShow);
  let html = shown.map(a => `<span class="tag">${escapeHtml(a.name)}</span>`).join('');
  if(rest.length){
    html += `<details class="more-toggle"><summary>+${rest.length} more</summary>${rest.map(a => `<span class="tag">${escapeHtml(a.name)}</span>`).join('')}</details>`;
  }
  return html;
}

function dietBadgesHtml(dietFlags, vegFlags){
  if(!dietFlags) return '';
  const dietDefs = [
    {key:'gluten', label:'Gluten Free'},
    {key:'dairy', label:'Dairy Free'},
    {key:'nut', label:'Nut Free'},
    {key:'shellfish', label:'Shellfish Free'},
  ];
  const badges = dietDefs.map(def => {
    const ok = dietFlags[def.key+'Free'];
    const culprits = dietFlags[def.key+'Culprits'] || [];
    if(ok === true) return `<span class="tag" style="background:var(--accent-soft);color:var(--accent);">${def.label}</span>`;
    if(ok === false){
      const maxNames = 3;
      let names = culprits.slice(0, maxNames).map(escapeHtml).join(', ');
      if(culprits.length > maxNames) names += `, +${culprits.length - maxNames} more`;
      const why = names ? ` (has: ${names})` : '';
      return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Not ${def.label}${why}</span>`;
    }
    return ''; // unverified ingredient present: omit rather than risk a false claim to customers
  }).join('');

  let vegBadges = '';
  if(vegFlags){
    const one = (val, label, culprits) => {
      if(val === true) return `<span class="tag" style="background:var(--accent-soft);color:var(--accent);">${label}</span>`;
      if(val === false){
        const maxNames = 3;
        let names = (culprits||[]).slice(0, maxNames).map(escapeHtml).join(', ');
        if((culprits||[]).length > maxNames) names += `, +${culprits.length - maxNames} more`;
        const why = names ? ` (has: ${names})` : '';
        return `<span class="tag" style="background:var(--danger-soft);color:var(--danger);">Not ${label}${why}</span>`;
      }
      return ''; // unknown/unclassified: omit rather than risk a false claim to customers
    };
    vegBadges = one(vegFlags.vegetarian, 'Vegetarian', vegFlags.vegetarianCulprits) + one(vegFlags.vegan, 'Vegan', vegFlags.veganCulprits);
  }
  return `<div style="margin-top:8px;">${badges}${vegBadges}</div>`;
}

function render(items){
  const el = document.getElementById('results');
  if(!items.length){ el.innerHTML = '<div class="empty">No matching menu items.</div>'; return; }
  el.innerHTML = items.map(m => `
    <details class="item">
      <summary>
        <span class="name">${escapeHtml(m.name)}</span>
        ${dotRowHtml(m.dietFlags, m.vegFlags)}
      </summary>
      <div class="item-detail">
        ${allergenTagsHtml(m.allergens)}
        ${dietBadgesHtml(m.dietFlags, m.vegFlags)}
      </div>
    </details>
  `).join('');
}

function dotRowHtml(dietFlags, vegFlags){
  const defs = [
    {val: dietFlags && dietFlags.glutenFree, label:'Gluten Free'},
    {val: dietFlags && dietFlags.dairyFree, label:'Dairy Free'},
    {val: dietFlags && dietFlags.nutFree, label:'Nut Free'},
    {val: dietFlags && dietFlags.shellfishFree, label:'Shellfish Free'},
    {val: vegFlags && vegFlags.vegetarian, label:'Vegetarian'},
    {val: vegFlags && vegFlags.vegan, label:'Vegan'},
  ];
  return `<span class="dot-row">${defs.map(d => {
    const color = d.val === true ? 'var(--accent)' : (d.val === false ? 'var(--danger)' : '#57514A');
    return `<span class="dot" style="background:${color};" title="${d.label}${d.val===true?': yes':(d.val===false?': no':': not classified')}"></span>`;
  }).join('')}</span>`;
}

document.getElementById('search').addEventListener('input', applyAndRender);

function escapeHtml(str){ const d=document.createElement('div'); d.textContent = str==null?'':str; return d.innerHTML; }
load();
</script>
</body>
</html>
